# Déploiement sur le VPS Datacloud.
#   cp .env.example .env.prod  (puis remplir)
#   docker compose -f infra/compose.prod.yml --env-file .env.prod up -d --build
# Base locale sur le VPS (au lieu de Neon) : ajouter --profile db

name: fricadev

x-node-service: &node-service
  restart: unless-stopped
  env_file: ../.env.prod
  build: &node-build
    context: ..
    dockerfile: infra/docker/Dockerfile

services:
  web:
    <<: *node-service
    build: { <<: *node-build, args: { APP: web, WEB_URL: "${WEB_URL}" } }
    environment:
      AUTH_INTERNAL_URL: http://auth:4001
      API_INTERNAL_URL: http://api:4000
      PORT: "3000"
    depends_on: [api, auth]

  api:
    <<: *node-service
    build: { <<: *node-build, args: { APP: api } }
    environment:
      # Clés publiques lues directement sur le réseau Docker, sans repasser par Internet.
      AUTH_JWKS_URL: http://auth:4001/jwks
      # Photos de profil sur disque (volume persistant) ; STORAGE_DRIVER=s3 pour Datacloud.
      UPLOADS_DIR: /data/uploads
      PUBLIC_UPLOADS_URL: https://api.${DOMAIN}/uploads
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  auth:
    <<: *node-service
    build: { <<: *node-build, args: { APP: auth } }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *node-service
    build: { <<: *node-build, args: { APP: worker } }

  # Migrations et données de départ, à lancer à chaque déploiement :
  #   docker compose -f infra/compose.prod.yml --env-file .env.prod --profile tools run --rm migrate-auth
  #   docker compose -f infra/compose.prod.yml --env-file .env.prod --profile tools run --rm migrate-api
  migrate-auth:
    <<: *node-service
    build: { <<: *node-build, args: { APP: auth } }
    restart: "no"
    profiles: [tools]
    command: npx prisma migrate deploy

  migrate-api:
    <<: *node-service
    build: { <<: *node-build, args: { APP: api } }
    restart: "no"
    profiles: [tools]
    command: sh -c "npx prisma migrate deploy && npm run db:seed"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:-fricadev.localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api, auth]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    profiles: [db]
    environment:
      POSTGRES_DB: fricadev
      POSTGRES_USER: fricadev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fricadev"]
      interval: 10s
      retries: 5

volumes:
  uploads:
  caddy_data:
  caddy_config:
  pg_data:
